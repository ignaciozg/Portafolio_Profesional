    <style>
        /* Estilos específicos para la galería */
        .gallery-img {
            height: 250px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        
        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            position: relative;
        }

        .gallery-item:hover .gallery-img {
            transform: scale(1.1);
            filter: brightness(0.7);
        }

        /* Overlay con el icono de lupa al pasar el mouse */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none; /* Para que el click pase a la imagen */
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }
    </style>

    <script>
        // Función para filtrar imágenes
        function filterGallery(category, btn) {
            // Actualizar botones activos
            document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const items = document.querySelectorAll('.filter-item');

            items.forEach(item => {
                if (category === 'all' || item.classList.contains(category)) {
                    item.style.display = 'block';
                    // Animación simple de entrada
                    item.animate([
                        { opacity: 0, transform: 'scale(0.9)' },
                        { opacity: 1, transform: 'scale(1)' }
                    ], {
                        duration: 300,
                        easing: 'ease-out'
                    });
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Función para abrir el Modal
        const myModal = new bootstrap.Modal(document.getElementById('imageModal'));
        const modalImg = document.getElementById('modalImage');
        const modalCaption = document.getElementById('modalCaption');

        function openModal(element) {
            const img = element.querySelector('img');
            modalImg.src = img.src.replace('w=600', 'w=1200'); // Cargar versión más grande si es posible
            modalCaption.textContent = img.getAttribute('data-caption');
            myModal.show();
        }
    </script>
